<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10213b">
<meta name="color-scheme" content="light">
<title>Каталог — Звягель Туристичний</title>
<meta name="description" content="Відкривайте Звягель: туристичні локації, екскурсії, новини, заклади харчування, проживання та проєкти.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://geografffff.github.io/zviahel_tourist/catalog.html">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f58220'/%3E%3Cg fill='none' stroke='%2310213b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3Cpath d='m20.5 11.5-2.2 6.8-6.8 2.2 2.2-6.8z'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Onest:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="design.css?v=4">

<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script defer src="site.js?v=5"></script>

<style>
/* Лише те, що потрібно каталогу. Спільні стилі — у design.css */
.catalog-hero { padding: clamp(32px, 5vw, 52px) 0; }
.catalog-hero h1 { margin-bottom: 12px; font-size: clamp(32px, 4.5vw, 48px); }

main { min-height: 45vh; padding: 28px 0 72px; }

.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 4px; }

.search { position: relative; flex: 1 1 280px; max-width: 520px; }
.search > .icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input {
  width: 100%;
  min-height: 48px;
  padding: 11px 44px;
  border: 1.5px solid #cfd8e5;
  border-radius: 12px;
  background: #fff;
  color: var(--text);
  box-shadow: 0 3px 12px rgba(16,33,59,.04);
}
.search input::-webkit-search-cancel-button { display: none; }
.search input:focus { border-color: var(--navy); }
.search-clear {
  position: absolute;
  right: 4px;
  top: 50%;
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.search-clear:hover { background: var(--bg); color: var(--navy); }

#result-count { margin: 14px 0 20px; color: var(--muted); font-size: 15px; }

.catalog-info { grid-column: 1 / -1; }

@media (max-width: 600px) {
  main { padding: 20px 0 48px; }
  .search { max-width: none; flex-basis: 100%; }
}
</style>
</head>

<body>

<a class="skip-link" href="#main">Перейти до змісту</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html#home" aria-label="Звягель Туристичний — головна сторінка">
      <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-compass"/></svg></span>
      <span class="brand-name">
        ЗВЯГЕЛЬ
        <span>ТУРИСТИЧНИЙ</span>
      </span>
    </a>
    <a class="btn btn--light btn--sm" href="index.html"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-arrow-left"/></svg> На головну</a>
  </div>
</header>

<section class="hero hero--light catalog-hero">
  <div class="container">
    <p class="eyebrow">Досліджуй та відкривай</p>
    <h1 id="catalog-title">Каталог</h1>
    <p class="intro" id="catalog-intro">Усі опубліковані туристичні матеріали.</p>
  </div>
</section>

<main id="main">
  <div class="container">

    <noscript><p class="noscript-note">Щоб побачити матеріали каталогу, увімкніть JavaScript у браузері.</p></noscript>

    <nav class="tabs" aria-label="Розділи каталогу">
      <a class="tab" data-section="places" href="catalog.html?section=places"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-landmark"/></svg> Цікавинки</a>
      <a class="tab" data-section="tours" href="catalog.html?section=tours"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-compass"/></svg> Екскурсії</a>
      <a class="tab" data-section="news" href="catalog.html?section=news"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-news"/></svg> Новини</a>
      <a class="tab" data-section="projects" href="catalog.html?section=projects"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-bulb"/></svg> Проєкти</a>
      <a class="tab" data-section="food" href="catalog.html?section=food"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-utensils"/></svg> Де поїсти</a>
      <a class="tab" data-section="stay" href="catalog.html?section=stay"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-bed"/></svg> Де переночувати</a>
      <a class="tab" data-section="gettingHere" href="catalog.html?section=gettingHere"><svg class="icon" aria-hidden="true"><use href="icons.svg#i-bus"/></svg> Як дістатися</a>
    </nav>

    <div class="toolbar" id="toolbar">
      <div class="search">
        <svg class="icon" aria-hidden="true"><use href="icons.svg#i-search"/></svg>
        <input id="search" type="search" placeholder="Пошук за назвою або описом…" aria-label="Пошук у каталозі" autocomplete="off">
        <button class="search-clear" id="searchClear" type="button" aria-label="Очистити пошук" hidden>
          <svg class="icon" aria-hidden="true"><use href="icons.svg#i-close"/></svg>
        </button>
      </div>
    </div>

    <p id="result-count" role="status" aria-live="polite">Завантаження записів…</p>
    <div id="catalog-list" class="cards"></div>
  </div>
</main>

<footer class="footer">
  <div class="container footer-row">
    <div>© <span id="year"></span> Звягель Туристичний</div>
    <div><a href="index.html#home">На головну</a></div>
  </div>
</footer>

<button id="backTop" class="back-top" type="button" aria-label="Повернутися вгору">
  <svg class="icon" aria-hidden="true"><use href="icons.svg#i-up"/></svg>
</button>

<script>
"use strict";

document.addEventListener("DOMContentLoaded", () => {
  const { $, el, icon, pick } = ZV;

  const GETTING_HERE = {
    key: "gettingHere",
    title: "Як дістатися до Звягеля?",
    intro: "Корисна інформація для планування подорожі до нашого міста.",
    empty: "Матеріал «Як дістатися?» ще не додано в адмінпанелі."
  };

  const params = new URLSearchParams(location.search);
  const requested = params.get("section") || "places";
  const isGettingHere = requested === "gettingHere";
  const type = isGettingHere ? "" : (ZV.typeByKey(requested) || "place");
  const cfg = isGettingHere ? GETTING_HERE : ZV.SECTIONS[type];

  const root = $("catalog-list");
  const input = $("search");
  const clearButton = $("searchClear");
  const counter = $("result-count");

  /* ----- Заголовок, вкладки, метадані ----- */

  $("catalog-title").textContent = cfg.title;
  $("catalog-intro").textContent = cfg.intro;
  ZV.setMeta({
    title: cfg.title + " — Звягель Туристичний",
    description: cfg.intro,
    path: "catalog.html?section=" + cfg.key
  });

  document.querySelectorAll(".tab").forEach(tab => {
    if (tab.dataset.section === cfg.key) tab.setAttribute("aria-current", "page");
  });

  /* ----- Пошук ----- */

  let allDocs = [];
  let loaded = false;

  function render() {
    const query = input.value.trim().toLocaleLowerCase("uk");
    clearButton.hidden = !input.value;

    if (!loaded) return;

    const docs = query ? allDocs.filter(item => (item.search || "").includes(query)) : allDocs;
    counter.textContent = "Знайдено записів: " + docs.length;

    if (!docs.length) {
      ZV.renderMessage(root, query ? "За вашим запитом нічого не знайдено." : cfg.empty);
      return;
    }
    ZV.renderCards(type, docs, root);
  }

  function syncUrl() {
    const url = new URL(location.href);
    if (input.value.trim()) url.searchParams.set("q", input.value.trim());
    else url.searchParams.delete("q");
    history.replaceState(null, "", url);
  }

  let timer = 0;
  input.addEventListener("input", () => {
    clearTimeout(timer);
    clearButton.hidden = !input.value;
    timer = setTimeout(() => { render(); syncUrl(); }, 120);
  });

  clearButton.addEventListener("click", () => {
    input.value = "";
    render();
    syncUrl();
    input.focus();
  });

  input.value = params.get("q") || "";

  /* ----- «Як дістатися» — один інформаційний блок із siteContent ----- */

  async function loadGettingHere() {
    $("toolbar").hidden = true;
    ZV.renderSkeleton(root);

    try {
      const snapshot = await ZV.getDb().collection("siteContent").doc("gettingHere").get();
      const data = snapshot.exists ? (ZV.plain(snapshot.data()) || {}) : {};
      const content = { ...data, ...(data.texts && typeof data.texts === "object" ? data.texts : {}) };

      const title = String(pick(content, "title", "heading", "hero_title") || cfg.title);
      const text = String(pick(content, "description", "text", "body", "hero_subtitle", "intro")).trim();

      if (!snapshot.exists || !text) {
        counter.textContent = "";
        ZV.renderMessage(root, cfg.empty);
        return;
      }

      $("catalog-title").textContent = title;
      ZV.setMeta({ title: title + " — Звягель Туристичний" });

      const panel = el("article", "info-panel catalog-info");
      panel.append(el("h2", "", title), el("div", "long-text", text));

      const buttons = el("div", "actions");
      const mapLink = ZV.safeHttps(pick(content, "mapLink", "mapUrl"));
      const directionsLink = ZV.safeHttps(pick(content, "directionsLink", "directionsUrl"));
      [[mapLink, "Відкрити Google Maps", true], [directionsLink, "Побудувати маршрут", false]].forEach(([href, label, primary]) => {
        if (!href) return;
        const link = el("a", "btn" + (primary ? "" : " btn--outline"));
        link.href = href;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.append(document.createTextNode(label), icon("arrow-up-right"));
        buttons.appendChild(link);
      });
      if (buttons.childNodes.length) panel.appendChild(buttons);

      counter.textContent = "";
      root.removeAttribute("aria-busy");
      root.replaceChildren(panel);
    } catch (error) {
      console.error("Firestore/siteContent:", error);
      counter.textContent = "Не вдалося завантажити матеріали.";
      ZV.renderMessage(root, "Не вдалося завантажити інформацію. Перевірте з’єднання та спробуйте ще раз.",
        window.firebase ? loadGettingHere : () => location.reload());
    }
  }

  /* ----- Старт ----- */

  ZV.init();

  if (isGettingHere) {
    loadGettingHere();
  } else {
    counter.textContent = "Завантаження записів…";
    ZV.mountSection(type, {
      root,
      search: true,
      onItems: items => { allDocs = items; loaded = true; render(); },
      onFail: () => { counter.textContent = "Не вдалося завантажити матеріали."; }
    });
    render();
  }
});
</script>
</body>
</html>
