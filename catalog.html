
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10213b">
<title>Каталог — Звягель Туристичний</title>
<style>
:root{--navy:#10213b;--navy2:#193657;--orange:#f58220;--bg:#f4f6fa;--line:#dce3ec;--text:#18263a;--muted:#687487}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 Arial,sans-serif;color:var(--text);background:#fff}
a{color:var(--navy)}
.container{width:min(1160px,calc(100% - 32px));margin:auto}
header{background:var(--navy);color:white;padding:17px 0}
header a{color:white;text-decoration:none;font-weight:bold}
.brand span{color:var(--orange)}
.hero{padding:38px 0;background:var(--bg);border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:bold;color:var(--orange)}
h1{font-size:clamp(30px,4vw,44px);line-height:1.15;color:var(--navy);margin:8px 0}
.intro{color:var(--muted);margin:0}
main{padding:30px 0 60px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}
input{width:min(100%,420px);padding:12px 14px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--orange);color:white;text-decoration:none;border:0;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer}
.btn.secondary{background:#e8eef6;color:var(--navy)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:20px}
.card{display:flex;flex-direction:column;min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:14px;box-shadow:0 7px 24px #10213b0b;background:white}
.card img,.placeholder,.image-gallery>img{width:100%;height:190px;object-fit:cover;display:block}
.placeholder{display:grid;place-items:center;color:var(--orange);background:linear-gradient(135deg,var(--navy),var(--navy2));font-size:40px}
.image-gallery{position:relative;overflow:hidden;background:#e7edf5}
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;border-radius:50%;background:#10213bcc;color:white;font-size:25px;cursor:pointer}
.gallery-prev{left:8px}.gallery-next{right:8px}
.gallery-count{position:absolute;right:8px;bottom:8px;padding:2px 8px;border-radius:20px;background:#10213bcc;color:white;font-size:12px}
.card-body{padding:17px;display:flex;flex-direction:column;flex:1}
h2{font-size:20px;color:var(--navy);margin:0 0 8px}
.card p{color:var(--muted);margin:0 0 13px;white-space:pre-line;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#f0f4f9;color:#40516a;border-radius:25px;padding:4px 8px;font-size:12px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
.actions .btn{font-size:12px;padding:8px 10px}
.empty{padding:20px 0;color:var(--muted)}
.footer{background:#091326;color:#cbd5e1;padding:20px 0;font-size:13px}
@media(max-width:560px){.container{width:calc(100% - 26px)}.card img,.placeholder,.image-gallery>img{height:175px}}
</style>
</head>
<body>
<header><div class="container"><a class="brand" href="index.html">ЗВЯГЕЛЬ <span>ТУРИСТИЧНИЙ</span></a></div></header>
<section class="hero"><div class="container">
<div class="eyebrow">Відкривай. Досліджуй. Повертайся.</div>
<h1 id="catalog-title">Каталог</h1>
<p class="intro" id="catalog-intro">Усі опубліковані записи.</p>
</div></section>
<main><div class="container">
<div class="toolbar">
<input id="search" type="search" placeholder="Пошук за назвою або описом…" aria-label="Пошук у каталозі">
<a class="btn secondary" href="index.html">← На головну</a>
</div>
<p id="result-count" class="intro"></p>
<div id="catalog-list" class="cards"><p class="empty">Завантаження…</p></div>
<p id="load-status" class="empty" role="status"></p>
</div></main>
<footer class="footer"><div class="container">© <span id="year"></span> Звягель Туристичний</div></footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
"use strict";
const FIREBASE_CONFIG={
apiKey:"AIzaSyDEizfKA8Ll-BT_olZSq7gt2z5WHH3PC2M",
authDomain:"zviahel-tourist.firebaseapp.com",
projectId:"zviahel-tourist",
storageBucket:"zviahel-tourist.firebasestorage.app",
messagingSenderId:"914549612868",
appId:"1:914549612868:web:3abce6606a89167134b711",
measurementId:"G-DV5YF43W24"
};
if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore();
const $=id=>document.getElementById(id);
$("year").textContent=new Date().getFullYear();

const sections={
places:{collection:"places",title:"Усі цікавинки Звягеля",intro:"Пам’ятки, історичні місця та цікаві локації.",type:"place"},
tours:{collection:"tours",title:"Усі екскурсії Звягелем",intro:"Обирайте маршрут і відкривайте місто разом з нами.",type:"tour"},
news:{collection:"news",title:"Усі новини та оголошення",intro:"Новини туристичного центру та події міста.",type:"news"},
food:{collection:"food",title:"Де поїсти у Звягелі",intro:"Заклади харчування для мешканців і гостей міста.",type:"food"},
stay:{collection:"stay",title:"Де переночувати у Звягелі",intro:"Готелі та інші варіанти розміщення.",type:"stay"}
};
const params=new URLSearchParams(location.search);
const section=params.get("section")||"places";
const config=sections[section]||sections.places;
$("catalog-title").textContent=config.title;
$("catalog-intro").textContent=config.intro;
document.title=config.title+" — Звягель Туристичний";

function safeHttps(v){try{const u=new URL(String(v||""));return u.protocol==="https:"?u.href:""}catch{return""}}
function link(text,href,cls){
const a=document.createElement("a");a.className="btn "+(cls||"");a.href=href;a.textContent=text;
if(href.startsWith("https://")){a.target="_blank";a.rel="noopener noreferrer"}return a;
}
function placeholder(){
const e=document.createElement("div");e.className="placeholder";
e.textContent=({place:"🏰",tour:"🧭",news:"📰",food:"🍽️",stay:"🛏️"})[config.type]||"📍";return e;
}
function gallery(d){
const urls=[...new Set([d.image,...(Array.isArray(d.images)?d.images:[])].map(safeHttps).filter(Boolean))];
if(!urls.length)return placeholder();
const g=document.createElement("div");g.className="image-gallery";
const img=document.createElement("img");img.src=urls[0];img.alt=(d.title||"Фото");img.loading="lazy";
img.onerror=()=>g.replaceWith(placeholder());g.appendChild(img);
if(urls.length===1)return g;
let active=0;const count=document.createElement("span");count.className="gallery-count";
function update(){img.src=urls[active];img.alt=(d.title||"Фото")+" — фото "+(active+1);count.textContent=(active+1)+" / "+urls.length}
function arrow(text,cls,step){
const b=document.createElement("button");b.type="button";b.className="gallery-arrow "+cls;b.textContent=text;
b.setAttribute("aria-label",step<0?"Попереднє фото":"Наступне фото");
b.onclick=()=>{active=(active+step+urls.length)%urls.length;update()};return b}
g.append(arrow("‹","gallery-prev",-1),arrow("›","gallery-next",1),count);update();return g;
}
let allDocs=[];
function render(){
const query=$("search").value.trim().toLocaleLowerCase("uk");
const docs=allDocs.filter(d=>{
const hay=[d.title,d.description,d.summary,d.body,d.address,d.subtitle].filter(Boolean).join(" ").toLocaleLowerCase("uk");
return hay.includes(query);
});
const root=$("catalog-list");root.replaceChildren();
$("result-count").textContent="Знайдено записів: "+docs.length;
if(!docs.length){const p=document.createElement("p");p.className="empty";p.textContent=query?"За вашим запитом нічого не знайдено.":"Опублікованих записів поки немає.";root.appendChild(p);return}
docs.forEach(d=>{
const card=document.createElement("article");card.className="card";card.appendChild(gallery(d));
const body=document.createElement("div");body.className="card-body";
const h=document.createElement("h2");h.textContent=d.title||"Без назви";body.appendChild(h);
if(config.type==="tour"&&d.subtitle){const p=document.createElement("p");p.textContent=d.subtitle;body.appendChild(p)}
if(["tour","food","stay"].includes(config.type)){
const meta=document.createElement("div");meta.className="meta";
const vals=config.type==="tour"?[["◷ ",d.duration],["₴ ",d.price]]:[["📍 ",d.address],["₴ ",d.price],["◷ ",d.hours]];
vals.filter(x=>x[1]).forEach(([pre,val])=>{const s=document.createElement("span");s.className="chip";s.textContent=pre+val;meta.appendChild(s)});
if(meta.childNodes.length)body.appendChild(meta);
}
const desc=config.type==="news"?(d.summary||d.body):d.description;
if(desc){const p=document.createElement("p");p.textContent=String(desc);body.appendChild(p)}
const actions=document.createElement("div");actions.className="actions";
if(["place","tour","news"].includes(config.type)){
actions.appendChild(link(config.type==="news"?"Читати новину →":"Детальніше →","article.html?type="+encodeURIComponent(section)+"&id="+encodeURIComponent(d.id),"secondary"));
}else{
const url=safeHttps(d.link);if(url)actions.appendChild(link("Детальніше ↗",url,"secondary"));
}
if(["tour","food","stay"].includes(config.type)){
const raw=String(d.phone||d.booking||"");const m=raw.match(/\+?[\d\s().-]{9,}/);
const phone=m?m[0].replace(/[^\d+]/g,""):"";
if(phone&&phone.replace(/\D/g,"").length>=10)actions.appendChild(link("☎ Зателефонувати","tel:"+phone));
else if(config.type==="tour")actions.appendChild(link("☎ Записатися","tel:+380673004470"));
const map=safeHttps(d.mapLink);if(map)actions.appendChild(link("На карті ↗",map,"secondary"));
}
if(actions.childNodes.length)body.appendChild(actions);
card.appendChild(body);root.appendChild(card);
});
}
$("search").addEventListener("input",render);
db.collection(config.collection).where("published","==",true).onSnapshot(s=>{
allDocs=s.docs.map(doc=>({...doc.data(),id:doc.id}));
if(config.type==="news")allDocs.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
render();
},error=>{
console.error(error);
$("catalog-list").replaceChildren();
$("load-status").textContent="Не вдалося завантажити записи. Перевірте інтернет і правила доступу Firebase.";
});
</script>
</body>
</html>
