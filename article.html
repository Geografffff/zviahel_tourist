
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10213b">
  <meta name="description" content="Дізнавайтеся більше про історію, пам'ятки та події Звягеля.">
  <title>Матеріал — Звягель Туристичний</title>

  <style>
    :root {
      --navy: #10213b;
      --blue: #1c385d;
      --orange: #f58220;
      --bg: #f4f6fa;
      --muted: #687487;
      --line: #e2e7ef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font: 16px/1.75 system-ui, Arial, sans-serif;
      color: var(--navy);
      background: var(--bg);
    }

    header {
      background: var(--navy);
      color: white;
      padding: 20px 0;
    }

    .container {
      width: min(900px, 92%);
      margin: auto;
    }

    .brand {
      color: white;
      font-size: 19px;
      font-weight: 900;
      text-decoration: none;
    }

    .brand span { color: var(--orange); }

    main { padding: 38px 0 65px; }

    .back {
      display: inline-block;
      margin-bottom: 22px;
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
    }

    .back:hover { color: var(--orange); }

    .article {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(20px, 5vw, 42px);
      box-shadow: 0 8px 30px #10213b0b;
    }

    .category {
      color: var(--orange);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    h1 {
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.2;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .date, .meta {
      color: var(--muted);
      font-size: 14px;
    }

    .cover {
      display: block;
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 12px;
      margin: 25px 0;
    }

    .content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-size: 17px;
    }

    .details {
      margin-top: 25px;
      padding: 18px;
      background: var(--bg);
      border-radius: 12px;
    }

    .details p { margin: 5px 0; }

    .btn {
      display: inline-block;
      margin: 10px 8px 0 0;
      padding: 11px 16px;
      background: var(--orange);
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 750;
    }

    .btn.secondary {
      background: #eaf0f7;
      color: var(--navy);
    }

    .status {
      padding: 30px 0;
      color: var(--muted);
    }

    footer {
      padding: 22px 0;
      background: #091326;
      color: #d6dce5;
      font-size: 14px;
    }

    @media (max-width: 560px) {
      main { padding-top: 24px; }
      .content { font-size: 16px; }
    }
  </style>
</head>

<body>
<header>
  <div class="container">
    <a class="brand" href="./">
      ЗВЯГЕЛЬ <span>ТУРИСТИЧНИЙ</span>
    </a>
  </div>
</header>

<main class="container">
  <a class="back" href="./">← На головну сторінку</a>

  <article class="article">
    <div id="category" class="category">Звягель Туристичний</div>
    <h1 id="title">Завантаження матеріалу…</h1>
    <div id="date" class="date"></div>
    <img id="cover" class="cover" alt="" hidden>
    <div id="content" class="content"></div>
    <div id="details" class="details" hidden></div>
    <div id="links"></div>
    <div id="status" class="status" role="status"></div>
  </article>
</main>

<footer>
  <div class="container">
    © <span id="year"></span> Звягель Туристичний.
    Відкривай. Досліджуй. Повертайся.
  </div>
</footer>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDEizfKA8Ll-BT_olZSq7gt2z5WHH3PC2M",
  authDomain: "zviahel-tourist.firebaseapp.com",
  projectId: "zviahel-tourist",
  storageBucket: "zviahel-tourist.firebasestorage.app",
  messagingSenderId: "914549612868",
  appId: "1:914549612868:web:3abce6606a89167134b711",
  measurementId: "G-DV5YF43W24"
};

if (!firebase.apps.length) {
  firebase.initializeApp(FIREBASE_CONFIG);
}

const db = firebase.firestore();
const $ = id => document.getElementById(id);

$("year").textContent = new Date().getFullYear();

function safeHttps(value) {
  try {
    const url = new URL(value);
    return url.protocol === "https:" ? url.href : "";
  } catch {
    return "";
  }
}

function addLink(label, value) {
  const url = safeHttps(value);
  if (!url) return;

  const a = document.createElement("a");
  a.className = "btn secondary";
  a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  a.textContent = label;
  $("links").appendChild(a);
}

function showError(message) {
  $("title").textContent = "Матеріал не знайдено";
  $("content").textContent = "";
  $("status").textContent = message;
}

async function loadArticle() {
  const params = new URLSearchParams(location.search);
  const type = params.get("type");
  const id = params.get("id");

  const collections = {
    news: {
      name: "news",
      label: "Новини та події"
    },
    places: {
      name: "places",
      label: "Цікавинки Звягеля"
    }
  };

  if (!collections[type] || !id || id.length > 1500) {
    showError("Перевірте посилання на матеріал.");
    return;
  }

  try {
    const doc = await db
      .collection(collections[type].name)
      .doc(id)
      .get();

    if (!doc.exists || doc.data().published !== true) {
      showError("Цей матеріал не знайдено або він ще не опублікований.");
      return;
    }

    const data = doc.data();

    document.title =
      (data.title || "Матеріал") + " — Звягель Туристичний";

    $("category").textContent = collections[type].label;
    $("title").textContent = data.title || "Без назви";

    if (type === "news" && data.date) {
      $("date").textContent = data.date;
    }

    const imageUrl = safeHttps(data.image);

    if (imageUrl) {
      $("cover").src = imageUrl;
      $("cover").alt = data.title || "Фото матеріалу";
      $("cover").hidden = false;

      $("cover").onerror = () => {
        $("cover").hidden = true;
      };
    }

    const fullText = type === "news"
      ? (data.body || data.summary || "")
      : (data.description || "");

    $("content").textContent = fullText;

    const details = $("details");
    const detailRows = [];

    if (data.address) {
      detailRows.push(["Адреса", data.address]);
    }

    if (data.hours) {
      detailRows.push([
        type === "places" ? "Графік відвідування" : "Час / графік",
        data.hours
      ]);
    }

    if (detailRows.length) {
      details.hidden = false;

      detailRows.forEach(([label, value]) => {
        const p = document.createElement("p");
        const strong = document.createElement("strong");
        strong.textContent = label + ": ";
        p.append(strong, document.createTextNode(value));
        details.appendChild(p);
      });
    }

    if (data.mapLink) {
      addLink("Відкрити на карті ↗", data.mapLink);
    }

    if (data.link) {
      addLink(
        type === "news"
          ? "Джерело новини ↗"
          : "Додаткова інформація ↗",
        data.link
      );
    }

    $("status").textContent = "";

  } catch (error) {
    console.error("Помилка завантаження матеріалу:", error);
    showError(
      "Не вдалося завантажити матеріал. Перевірте інтернет і правила доступу Firebase."
    );
  }
}

loadArticle();
</script>
</body>
</html>
