
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10213b">
<meta name="description" content="Відкрийте для себе екскурсії та історичні пам'ятки Звягеля.">
<title>Екскурсія — Звягель Туристичний</title>

<style>
:root {
  --navy: #10213b;
  --navy2: #193657;
  --orange: #f58220;
  --bg: #f4f6fa;
  --line: #dce3ec;
  --text: #18263a;
  --muted: #687487;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: 110px;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  line-height: 1.65;
  color: var(--text);
  background: #fff;
}

a { color: inherit; }

.container {
  width: min(1120px, calc(100% - 32px));
  margin: 0 auto;
}

/* ШАПКА */

header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--navy);
  color: white;
  border-bottom: 3px solid var(--orange);
  box-shadow: 0 5px 20px #10213b20;
}

.header-inner {
  min-height: 76px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  color: white;
  text-decoration: none;
  font-size: 19px;
  font-weight: 800;
}

.brand b { color: var(--orange); }

.brand-icon {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--orange);
  font-size: 23px;
}

.header-link {
  color: white;
  text-decoration: none;
  border: 1px solid #ffffff35;
  padding: 9px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
}

.header-link:hover { background: #ffffff15; }

/* КНОПКИ */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 13px 19px;
  background: var(--orange);
  color: white;
  border: 0;
  border-radius: 11px;
  font-weight: 800;
  text-decoration: none;
  cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 20px #f5822038;
}

.btn-outline {
  background: white;
  color: var(--navy);
  border: 1px solid var(--line);
  box-shadow: none;
}

/* СТАН ЗАВАНТАЖЕННЯ */

.state {
  max-width: 760px;
  margin: 65px auto;
  padding: 28px;
  text-align: center;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 16px;
}

.state h1 { color: var(--navy); }

/* ГЕРОЙ */

.hero {
  background: var(--navy);
  color: white;
}

.hero-inner {
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  align-items: center;
  gap: 35px;
  padding-top: 38px;
  padding-bottom: 42px;
}

.breadcrumbs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin-bottom: 22px;
  color: #c7d3e3;
  font-size: 13px;
}

.breadcrumbs a {
  color: #fff;
  text-decoration: none;
}

.breadcrumbs a:hover { color: #ffb36c; }

.eyebrow {
  color: var(--orange);
  font-size: 12px;
  letter-spacing: 1.8px;
  text-transform: uppercase;
  font-weight: 800;
  margin-bottom: 10px;
}

h1 {
  margin: 0 0 18px;
  font-size: clamp(31px, 4vw, 49px);
  line-height: 1.12;
  overflow-wrap: anywhere;
}

.hero-description {
  color: #dbe4ef;
  font-size: 17px;
  white-space: pre-line;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 24px;
}

.hero-photo {
  position: relative;
  min-height: 320px;
  border-radius: 19px;
  overflow: hidden;
  background: linear-gradient(135deg, #294b70, #071629);
  box-shadow: 0 16px 40px #00000035;
}

.hero-photo img {
  display: block;
  width: 100%;
  height: 350px;
  object-fit: cover;
}

.photo-caption {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: 12px;
  padding: 10px 13px;
  border-radius: 10px;
  background: #10213bd9;
  color: white;
  font-size: 12px;
}

/* ОСНОВНА ІНФОРМАЦІЯ */

main { min-height: 300px; }

.section { padding: 44px 0; }

.section-alt { background: var(--bg); }

h2 {
  color: var(--navy);
  font-size: clamp(25px, 3vw, 34px);
  line-height: 1.25;
  margin: 0 0 18px;
}

h3 {
  color: var(--navy);
  line-height: 1.3;
}

.facts {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-top: -1px;
}

.fact {
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: white;
  box-shadow: 0 5px 18px #10213b08;
  min-width: 0;
}

.fact-icon {
  font-size: 25px;
  margin-bottom: 8px;
}

.fact-label {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}

.fact-value {
  font-weight: 800;
  color: var(--navy);
  overflow-wrap: anywhere;
}

/* ОПИС */

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 35px;
  align-items: start;
}

.description {
  white-space: pre-line;
  overflow-wrap: anywhere;
  font-size: 16px;
}

.description p { margin: 0 0 15px; }

.sidebar-card {
  padding: 23px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: 0 6px 25px #10213b09;
}

.sidebar-card h3 { margin-top: 0; }

.sidebar-card p { color: var(--muted); }

.sidebar-card .btn {
  width: 100%;
  text-align: center;
  margin-top: 8px;
}

/* МАРШРУТ */

.route-list {
  display: grid;
  gap: 0;
  margin-top: 24px;
}

.route-stop {
  display: grid;
  grid-template-columns: 45px minmax(0, 1fr);
  gap: 15px;
  position: relative;
  padding-bottom: 26px;
}

.route-stop:not(:last-child)::before {
  content: "";
  position: absolute;
  left: 17px;
  top: 37px;
  bottom: 0;
  width: 2px;
  background: #f4c49e;
}

.route-number {
  width: 37px;
  height: 37px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: white;
  background: var(--orange);
  font-weight: 800;
  position: relative;
  z-index: 1;
}

.route-title {
  margin: 2px 0 5px;
  color: var(--navy);
  font-weight: 800;
}

.route-description {
  color: var(--muted);
  white-space: pre-line;
}

/* ГАЛЕРЕЯ */

.gallery {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 13px;
  margin-top: 20px;
}

.gallery-item {
  border: 0;
  padding: 0;
  border-radius: 13px;
  overflow: hidden;
  background: #e8edf4;
  cursor: zoom-in;
}

.gallery-item img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  display: block;
  transition: transform .25s;
}

.gallery-item:hover img { transform: scale(1.04); }

.gallery-empty {
  color: var(--muted);
  background: white;
  padding: 18px;
  border-radius: 12px;
}

/* КОНТАКТИ */

.contacts {
  padding: 55px 0;
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  color: white;
  border-top: 5px solid var(--orange);
  scroll-margin-top: 95px;
}

.contacts h2 { color: white; }

.contacts-intro {
  max-width: 700px;
  color: #dce6f2;
}

.contact-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-top: 25px;
}

.contact-card {
  padding: 23px;
  border: 1px solid #ffffff25;
  border-radius: 15px;
  background: #ffffff0c;
}

.contact-card h3 { color: white; margin-top: 0; }

.contact-row {
  padding: 11px 0;
  border-bottom: 1px solid #ffffff20;
}

.contact-row:last-child { border-bottom: 0; }

.contact-label {
  display: block;
  color: #ffb56e;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 3px;
}

.contact-row a {
  color: white;
  text-decoration: none;
  overflow-wrap: anywhere;
}

.contact-row a:hover { text-decoration: underline; }

.contact-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}

.contact-actions .btn-outline {
  background: transparent;
  border-color: #ffffff45;
  color: white;
}

/* ПІДВАЛ */

footer {
  padding: 22px 0;
  background: #091326;
  color: #cbd5e1;
  font-size: 13px;
}

.footer-row {
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

footer a { color: white; }

/* ПЕРЕГЛЯД ФОТО */

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 25px;
  background: #050b15ed;
}

.lightbox.open { display: flex; }

.lightbox img {
  max-width: 100%;
  max-height: 85vh;
  object-fit: contain;
  border-radius: 8px;
}

.lightbox-close {
  position: absolute;
  top: 18px;
  right: 20px;
  width: 43px;
  height: 43px;
  border: 0;
  border-radius: 50%;
  background: white;
  color: var(--navy);
  font-size: 25px;
  cursor: pointer;
}

@media (max-width: 850px) {
  .hero-inner { grid-template-columns: 1fr; }
  .hero-photo img { height: 310px; }
  .content-grid { grid-template-columns: 1fr; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 560px) {
  .container { width: calc(100% - 26px); }

  .header-inner {
    min-height: 67px;
  }

  .brand { font-size: 16px; }
  .brand-icon { width: 37px; height: 37px; }

  .header-link {
    padding: 8px 10px;
    font-size: 12px;
  }

  .hero-inner { padding-top: 25px; padding-bottom: 30px; }
  .hero-photo { min-height: 220px; }
  .hero-photo img { height: 230px; }
  .hero-description { font-size: 15px; }

  .section { padding: 33px 0; }

  .facts { gap: 9px; }

  .fact { padding: 13px; }

  .fact-icon { font-size: 21px; }

  .fact-value { font-size: 14px; }

  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .gallery-item img { height: 130px; }

  .contact-grid { grid-template-columns: 1fr; }
  .contact-card { padding: 17px; }

  .hero-actions .btn,
  .contact-actions .btn { flex: 1 1 100%; }

  .route-stop { grid-template-columns: 39px minmax(0, 1fr); gap: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; }
}
</style>
</head>

<body>

<header>
  <div class="container header-inner">
    <a class="brand" href="index.html#home">
      <span class="brand-icon">🧭</span>
      <span>Звягель <b>Туристичний</b></span>
    </a>

    <a class="header-link" href="index.html#tours">← Усі екскурсії</a>
  </div>
</header>

<main id="main-content">
  <div class="container">
    <div class="state">
      <h1>Завантажуємо сторінку…</h1>
      <p>Зачекайте, будь ласка.</p>
    </div>
  </div>
</main>

<footer>
  <div class="container footer-row">
    <div>© <span id="year"></span> Звягель Туристичний</div>
    <div><a href="index.html#home">На головну</a></div>
  </div>
</footer>

<div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Перегляд фотографії">
  <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Закрити">×</button>
  <img id="lightbox-image" alt="Збільшена фотографія">
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
"use strict";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDEizfKA8Ll-BT_olZSq7gt2z5WHH3PC2M",
  authDomain: "zviahel-tourist.firebaseapp.com",
  projectId: "zviahel-tourist",
  storageBucket: "zviahel-tourist.firebasestorage.app",
  messagingSenderId: "914549612868",
  appId: "1:914549612868:web:3abce6606a89167134b711",
  measurementId: "G-DV5YF43W24"
};

if (!firebase.apps.length) {
  firebase.initializeApp(FIREBASE_CONFIG);
}

const db = firebase.firestore();
const $ = id => document.getElementById(id);

$("year").textContent = new Date().getFullYear();

/* ПАРАМЕТРИ ПОСИЛАННЯ */

const params = new URLSearchParams(location.search);
const rawType = (params.get("type") || "tours").toLowerCase();
const id = params.get("id");

const typeMap = {
  tour: "tours",
  tours: "tours",
  place: "places",
  places: "places",
  news: "news"
};

const type = typeMap[rawType] || "tours";

const labels = {
  tours: "Екскурсії",
  places: "Цікавинки",
  news: "Новини"
};

const icons = {
  tours: "🧭",
  places: "🏰",
  news: "📰"
};

/* БЕЗПЕЧНА РОБОТА З ПОСИЛАННЯМИ */

function safeHttps(value) {
  try {
    const url = new URL(String(value || ""), location.href);

    if (url.protocol === "https:" || url.protocol === "http:") {
      return url.href;
    }

    return "";
  } catch {
    return "";
  }
}

function setLink(id, value) {
  const element = $(id);
  if (!element) return;

  const url = safeHttps(value);

  if (url) {
    element.href = url;
    element.hidden = false;
  } else {
    element.hidden = true;
  }
}

/* СТВОРЕННЯ HTML-ЕЛЕМЕНТІВ */

function element(tag, className, text) {
  const node = document.createElement(tag);

  if (className) node.className = className;
  if (text !== undefined && text !== null) {
    node.textContent = String(text);
  }

  return node;
}

function makeButton(text, href, className) {
  const link = element("a", className || "btn", text);
  link.href = href;
  return link;
}

function addFact(parent, icon, label, value) {
  if (!value && value !== 0) return;

  const card = element("div", "fact");
  card.appendChild(element("div", "fact-icon", icon));
  card.appendChild(element("div", "fact-label", label));
  card.appendChild(element("div", "fact-value", value));

  parent.appendChild(card);
}

/* ФОТО */

function getImages(data) {
  return [...new Set(
    [
      data.image,
      ...(Array.isArray(data.images) ? data.images : [])
    ].map(safeHttps).filter(Boolean)
  )];
}

function makePhoto(url, title, className) {
  const img = element("img");
  img.src = url;
  img.alt = title || "Фото Звягеля";
  img.loading = "lazy";

  img.onerror = () => {
    img.style.display = "none";
  };

  if (className) img.className = className;

  return img;
}

function createGallery(images, title) {
  const gallery = $("gallery");
  gallery.replaceChildren();

  if (!images.length) {
    gallery.appendChild(
      element("div", "gallery-empty", "Фотографії цієї локації незабаром з’являться.")
    );
    return;
  }

  images.forEach((url, index) => {
    const button = element("button", "gallery-item");
    button.type = "button";
    button.setAttribute("aria-label", "Відкрити фото " + (index + 1));

    const img = makePhoto(url, title + " — фото " + (index + 1));
    button.appendChild(img);

    button.onclick = () => openLightbox(url, title);

    gallery.appendChild(button);
  });
}

function openLightbox(url, title) {
  $("lightbox-image").src = url;
  $("lightbox-image").alt = title || "Фотографія";
  $("lightbox").classList.add("open");
  $("lightbox-close").focus();
}

function closeLightbox() {
  $("lightbox").classList.remove("open");
  $("lightbox-image").src = "";
}

$("lightbox-close").onclick = closeLightbox;

$("lightbox").addEventListener("click", event => {
  if (event.target === $("lightbox")) closeLightbox();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeLightbox();
});

/* РОЗБІР ОПИСУ */

function addDescription(container, value) {
  if (!value) {
    container.appendChild(
      element("p", "", "Детальний опис цієї екскурсії незабаром буде додано.")
    );
    return;
  }

  String(value).split(/\n{2,}/).forEach(part => {
    const trimmed = part.trim();
    if (!trimmed) return;

    container.appendChild(element("p", "", trimmed));
  });
}

/* МАРШРУТ
   Підтримує масив route або stops у документі Firestore.
*/

function renderRoute(data) {
  const section = $("route-section");
  const list = $("route-list");
  list.replaceChildren();

  let stops = data.route || data.stops || [];

  if (typeof stops === "string") {
    stops = stops.split(/\n+/).map(line => line.trim()).filter(Boolean);
  }

  if (!Array.isArray(stops) || !stops.length) {
    section.hidden = true;
    return;
  }

  stops.forEach((stop, index) => {
    const item = element("div", "route-stop");
    item.appendChild(element("div", "route-number", index + 1));

    const details = element("div");

    if (typeof stop === "string") {
      details.appendChild(element("div", "route-title", stop));
    } else {
      details.appendChild(
        element("div", "route-title", stop.title || stop.name || ("Зупинка " + (index + 1)))
      );

      if (stop.description || stop.text) {
        details.appendChild(
          element("div", "route-description", stop.description || stop.text)
        );
      }
    }

    item.appendChild(details);
    list.appendChild(item);
  });

  section.hidden = false;
}

/* ПОКАЗ СТОРІНКИ */

function renderArticle(data, documentId) {
  const title = data.title || "Без назви";
  const description = data.description || data.body || data.summary || "";
  const images = getImages(data);

  document.title = title + " — Звягель Туристичний";

  const main = $("main-content");
  main.replaceChildren();

  /* HERO */

  const hero = element("section", "hero");
  const heroInner = element("div", "container hero-inner");
  const heroText = element("div");

  const breadcrumbs = element("div", "breadcrumbs");
  breadcrumbs.appendChild(makeButton("Головна", "index.html#home", ""));
  breadcrumbs.appendChild(element("span", "", " / "));
  breadcrumbs.appendChild(makeButton(labels[type], "index.html#" + type, ""));
  breadcrumbs.appendChild(element("span", "", " / "));
  breadcrumbs.appendChild(element("span", "", title));

  heroText.appendChild(breadcrumbs);
  heroText.appendChild(element("div", "eyebrow", labels[type]));
  heroText.appendChild(element("h1", "", title));

  const shortDescription =
    data.subtitle || data.shortDescription || data.summary || description;

  if (shortDescription) {
    heroText.appendChild(
      element("div", "hero-description", String(shortDescription).slice(0, 650))
    );
  }

  const heroActions = element("div", "hero-actions");

  heroActions.appendChild(
    makeButton("Записатися на екскурсію ↓", "#contacts", "btn")
  );

  heroActions.appendChild(
    makeButton("← Назад до списку", "index.html#" + type, "btn btn-outline")
  );

  heroText.appendChild(heroActions);

  const photo = element("div", "hero-photo");

  if (images.length) {
    photo.appendChild(makePhoto(images[0], title));
    photo.appendChild(element("div", "photo-caption", "Звягель Туристичний"));
  } else {
    photo.style.minHeight = "300px";
    photo.style.display = "grid";
    photo.style.placeItems = "center";
    photo.appendChild(element("div", "", icons[type] || "🧭"));
  }

  heroInner.append(heroText, photo);
  hero.appendChild(heroInner);
  main.appendChild(hero);

  /* ФАКТИ */

  const factsSection = element("section", "section");
  const facts = element("div", "container facts");

  if (type === "tours") {
    addFact(facts, "⏱️", "Тривалість", data.duration || "Уточнюйте");
    addFact(facts, "👥", "Формат", data.format || "Груповий / індивідуальний");
    addFact(facts, "🎟️", "Вартість", data.price || "Уточнюйте");
    addFact(facts, "📍", "Місце початку", data.startPoint || data.address || "Уточнюйте");
  } else if (type === "places") {
    addFact(facts, "📍", "Адреса", data.address || "Звягель");
    addFact(facts, "🕒", "Графік відвідування", data.hours || data.schedule || "Уточнюйте");
    addFact(facts, "🏛️", "Тип локації", data.category || "Історична пам’ятка");
  } else {
    addFact(facts, "📰", "Дата публікації", data.date || "");
  }

  if (facts.childNodes.length) {

  sidebar.appendChild(element("h3", "", type === "tours" ? "Відкрийте Звягель разом з нами" : "Відкрийте Звягель"));

  sidebar.appendChild(

      "",
      type === "tours"

  sidebar.appendChild(

  main.appendChild(descriptionSection);

  /* МАРШРУТ */

  const routeSection = element("section", "section");
  routeSection.id = "route-section";

  const routeContainer = element("div", "container");
  routeContainer.appendChild(element("div", "eyebrow", "Крок за кроком"));
  routeContainer.appendChild(element("h2", "", "Маршрут екскурсії"));

  const routeList = element("div", "route-list");

  /* ГАЛЕРЕЯ */

  gallerySection.appendChild(galleryContainer);

  /* КОНТАКТИ

        : "Звертайтеся до туристичного центру за інформацією про локацію, екскурсії та туристичні маршрути Звягеля."

  const contactGrid = element("div", "contact-grid");

  const details = element("div", "contact-card");
  details.appendChild(element("h3", "", "Туристичний центр"));

  const phoneRow = element("div", "contact-row");
  phoneRow.appendChild(element("span", "contact-label", "Телефон"));

  const phoneLink = element("a", "", "+38 067 300 4470");
  phoneLink.href = "tel:+380673004470";
  phoneRow.appendChild(phoneLink);
  details.appendChild(phoneRow);

  const addressRow = element("div", "contact-row");
  addressRow.appendChild(element("span", "contact-label", "Адреса"));

  const emailRow = element("div", "contact-row");
  emailRow.appendChild(element("span", "contact-label", "Електронна пошта"));

  const emailLink = element("a", "", "tic.zvyagel@gmail.com");
  emailLink.href = "mailto:tic.zvyagel@gmail.com";
  emailRow.appendChild(emailLink);
  details.appendChild(emailRow);

  const info = element("div", "contact-card");
  info.appendChild(element("h3", "", "Наступний крок"));

  info.appendChild(
    element(
      "p",
      "",
      type === "tours"

        : "Напишіть або зателефонуйте нам, і ми допоможемо спланувати знайомство зі Звягелем."

  );

  const contactActions = element("div", "contact-actions");

  contactActions.appendChild(
    makeButton("☎ Зателефонувати", "tel:+380673004470", "btn")
  );

  contactActions.appendChild(
    makeButton("✉ Написати листа", "mailto:tic.zvyagel@gmail.com", "btn btn-outline")
  );

  info.appendChild(contactActions);

  const social = element("div", "contact-actions");
  social.appendChild(
    makeButton(

  social.appendChild(
    makeButton(

      "https://www.instagram.com/zviahel_tourist_centr/",

  contactGrid.append(details, info);
  contactsContainer.appendChild(contactGrid);
  contacts.appendChild(contactsContainer);
  main.appendChild(contacts);

  /* ПЕРЕХІД ДО КОНТАКТІВ */

  main.querySelectorAll('a[href="#contacts"]').forEach(link => {
    link.addEventListener("click", event => {
      event.preventDefault();

      contacts.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

      history.replaceState(null, "", "#contacts");
    });
  });

  /* ДАНІ ДЛЯ ПОШУКУ */

  let metaDescription = String(shortDescription || description || title);
  metaDescription = metaDescription.replace(/\s+/g, " ").slice(0, 155);

  const descriptionMeta = document.querySelector('meta[name="description"]');
  if (descriptionMeta) descriptionMeta.content = metaDescription;
}

/* ПОМИЛКИ */

function showError(message) {
  const main = $("main-content");
  main.replaceChildren();

  const container = element("div", "container");
  const state = element("div", "state");

  state.appendChild(element("div", "", "⚠️"));
  state.appendChild(element("h1", "", "Не вдалося відкрити сторінку"));

  state.appendChild(element("p", "", message));

  state.appendChild(
    makeButton("Повернутися до екскурсій", "index.html#tours", "btn")
  );

  container.appendChild(state);
  main.appendChild(container);
}

/* ЗАВАНТАЖЕННЯ */

async function loadArticle() {
  if (!id) {
    showError("У посиланні немає ідентифікатора запису. Поверніться до списку й відкрийте потрібну екскурсію ще раз.");
    return;
  }

  try {
    const snapshot = await db.collection(type).doc(id).get();

    if (!snapshot.exists) {
      showError("Цей запис не знайдено. Можливо, його видалено або посилання застаріло.");
      return;
    }

    const data = snapshot.data();

    if (data.published !== true) {
      showError("Цей матеріал наразі недоступний для перегляду.");
      return;
    }

    renderArticle(data, snapshot.id);

  } catch (error) {
    console.error("Помилка завантаження матеріалу:", error);

    showError(
      "Не вдалося завантажити матеріал. Перевірте підключення до інтернету та правила доступу Firebase."
    );
  }
}

loadArticle();
