
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10213b">
<meta name="description" content="Дізнавайтеся більше про екскурсії, пам'ятки, історію та події Звягеля.">
<title>Матеріал — Звягель Туристичний</title>
<style>
:root{--navy:#10213b;--blue:#1c385d;--orange:#f58220;--bg:#f4f6fa;--muted:#687487;--line:#e2e7ef}
*{box-sizing:border-box}
body{margin:0;font:16px/1.75 system-ui,Arial,sans-serif;color:var(--navy);background:var(--bg)}
header{background:var(--navy);color:white;padding:20px 0}
.container{width:min(900px,92%);margin:auto}
.brand{color:white;font-size:19px;font-weight:900;text-decoration:none}
.brand span{color:var(--orange)}
main{padding:38px 0 65px}
.back{display:inline-block;margin-bottom:22px;color:var(--blue);font-weight:700;text-decoration:none}
.back:hover{color:var(--orange)}
.article{background:white;border:1px solid var(--line);border-radius:18px;padding:clamp(20px,5vw,42px);box-shadow:0 8px 30px #10213b0b}
.category{color:var(--orange);font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px}
h1{font-size:clamp(30px,5vw,46px);line-height:1.2;margin:12px 0;overflow-wrap:anywhere}
.date,.meta{color:var(--muted);font-size:14px}
.cover{display:block;width:100%;max-height:500px;object-fit:cover;border-radius:12px;margin:25px 0}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0 26px}
.gallery img{display:block;width:100%;height:160px;object-fit:cover;border-radius:10px;cursor:zoom-in}
.content{white-space:pre-wrap;overflow-wrap:anywhere;font-size:17px}
.details{margin-top:25px;padding:18px;background:var(--bg);border-radius:12px}
.details p{margin:5px 0}
.btn{display:inline-block;margin:10px 8px 0 0;padding:11px 16px;background:var(--orange);color:white;border-radius:8px;text-decoration:none;font-weight:750}
.btn.secondary{background:#eaf0f7;color:var(--navy)}
.status{padding:20px 0;color:var(--muted)}
footer{padding:22px 0;background:#091326;color:#d6dce5;font-size:14px}
@media(max-width:560px){main{padding-top:24px}.content{font-size:16px}}
</style>
</head>
<body>
<header><div class="container"><a class="brand" href="./">ЗВЯГЕЛЬ <span>ТУРИСТИЧНИЙ</span></a></div></header>
<main class="container">
<a class="back" id="back-link" href="./">← На головну сторінку</a>
<article class="article">
<div id="category" class="category">Звягель Туристичний</div>
<h1 id="title">Завантаження матеріалу…</h1>
<div id="date" class="date"></div>
<img id="cover" class="cover" alt="" hidden>
<div id="gallery" class="gallery" hidden></div>
<div id="content" class="content"></div>
<div id="details" class="details" hidden></div>
<div id="links"></div>
<div id="status" class="status" role="status"></div>
</article>
</main>
<footer><div class="container">© <span id="year"></span> Звягель Туристичний. Відкривай. Досліджуй. Повертайся.</div></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const FIREBASE_CONFIG={
apiKey:"AIzaSyDEizfKA8Ll-BT_olZSq7gt2z5WHH3PC2M",
authDomain:"zviahel-tourist.firebaseapp.com",
projectId:"zviahel-tourist",
storageBucket:"zviahel-tourist.firebasestorage.app",
messagingSenderId:"914549612868",
appId:"1:914549612868:web:3abce6606a89167134b711",
measurementId:"G-DV5YF43W24"
};
if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.firestore(),$=id=>document.getElementById(id);
$("year").textContent=new Date().getFullYear();

function safeHttps(value){
try{const u=new URL(String(value||""));return u.protocol==="https:"?u.href:""}catch{return ""}
}
function addLink(label,value){
const url=safeHttps(value);
if(!url)return;
const a=document.createElement("a");a.className="btn secondary";a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=label;$("links").appendChild(a)
}
function addPhoneLink(label,value){
if(!value)return;
const digits=String(value).replace(/[^\d+]/g,"");
if(digits.replace(/\D/g,"").length<10)return;
const a=document.createElement("a");a.className="btn";a.href="tel:"+digits;a.textContent=label;$("links").appendChild(a)
}
function showError(message){
$("title").textContent="Матеріал не знайдено";$("content").textContent="";$("status").textContent=message
}
function addDetail(label,value){
if(value===undefined||value===null||String(value).trim()==="")return;
const p=document.createElement("p"),b=document.createElement("strong");
b.textContent=label+": ";p.append(b,document.createTextNode(String(value)));$("details").appendChild(p);$("details").hidden=false
}
async function loadArticle(){
const params=new URLSearchParams(location.search),type=params.get("type"),id=params.get("id");
const collections={
news:{name:"news",label:"Новини та події"},
tours:{name:"tours",label:"Екскурсії Звягеля"},
places:{name:"places",label:"Цікавинки Звягеля"}
};
if(!collections[type]||!id||id.length>1500){showError("Перевірте посилання на матеріал.");return}
$("back-link").href=type==="tours"?"./#tours":type==="news"?"./#news":"./#places";
try{
const snap=await db.collection(collections[type].name).doc(id).get();
if(!snap.exists||snap.data().published!==true){showError("Цей матеріал не знайдено або він ще не опублікований.");return}
const d=snap.data();
$("title").textContent=d.title||"Без назви";
$("category").textContent=collections[type].label;
document.title=(d.title||"Матеріал")+" — Звягель Туристичний";
if(type==="news"&&d.date)$("date").textContent=d.date;
const cover=safeHttps(d.image);
if(cover){$("cover").src=cover;$("cover").alt=d.title||"Фото матеріалу";$("cover").hidden=false;$("cover").onerror=()=>{$("cover").hidden=true}}
const fullText=type==="news"?(d.body||d.summary||""):(d.description||"");
$("content").textContent=fullText;

/* Додаткова галерея фотографій екскурсії */
if(type==="tours"&&Array.isArray(d.images)){
const gallery=$("gallery");
const urls=[...new Set(d.images.map(safeHttps).filter(Boolean))].filter(u=>u!==cover);
urls.forEach((url,i)=>{
const img=document.createElement("img");img.src=url;img.alt=(d.title||"Екскурсія")+" — фото "+(i+1);img.loading="lazy";
img.addEventListener("click",()=>window.open(url,"_blank","noopener,noreferrer"));
img.onerror=()=>img.remove();gallery.appendChild(img)
});
gallery.hidden=gallery.childElementCount===0
}
if(type==="tours"){
addDetail("Тривалість",d.duration);
addDetail("Вартість / умови",d.price);
addDetail("Умови запису",d.booking);
addDetail("Адреса початку",d.address);
addPhoneLink("☎ Зателефонувати для запису",d.phone||d.booking||"+380673004470");
}else{
addDetail("Адреса",d.address);
addDetail("Графік відвідування",d.hours);
}
if(type==="news"&&d.date)addDetail("Дата",d.date);
addLink("Відкрити на карті ↗",d.mapLink);
addLink(type==="news"?"Джерело новини ↗":"Додаткова інформація ↗",d.link);
$("status").textContent="";
}catch(error){
console.error("Помилка завантаження матеріалу:",error);
showError("Не вдалося завантажити матеріал. Перевірте інтернет і правила доступу Firebase.")
}
}
loadArticle();
</script>
</body>
</html>
